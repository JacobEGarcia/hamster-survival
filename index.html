<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamster Survival</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ec;--ink:#3d2f22;--dim:#a08a70;--accent:#e0a32e;--blue:#5b8dd9;--good:#5da865;--line:#efe0c8;--card:#fffdf7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px 64px}
h1{font-size:34px;font-weight:900;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;font-weight:700;margin-top:4px}
#cage{margin:26px 0 6px;font-size:72px;line-height:1;width:150px;height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fffdf7 40%,#f7e8cd);border:2px dashed #e3cf9f;border-radius:50%;transition:transform .2s}
#cage.act{transform:scale(1.12)}
#status{font-style:italic;color:var(--dim);font-size:14.5px;margin:14px 0 4px;min-height:22px}
#stats{width:min(430px,94vw);margin-top:18px;display:grid;gap:10px}
.stat .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.stat .bar{height:10px;background:#f3e9d4;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.stat .fill{height:100%;border-radius:999px;transition:width .3s}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(430px,94vw);margin-top:18px}
#actions button{cursor:pointer;padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.06em;transition:all .15s}
#actions button small{display:block;font-weight:700;font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:0}
#actions button:hover{border-color:var(--accent);transform:translateY(-1px)}
#hud{margin-top:18px;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
#hud b{color:var(--accent);margin:0 2px}
#log{width:min(430px,94vw);margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
#log:empty{display:none}
#log b{color:var(--ink)}
#overlay{position:fixed;inset:0;background:rgba(50,38,22,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:20}
#overlay.show{display:flex}
#overlay h2{font-size:30px;letter-spacing:2px;color:#f5d89a;font-weight:900}
#overlay p{color:#d8c4a4;max-width:420px;line-height:1.7;font-size:14px}
#again{cursor:pointer;padding:13px 28px;border-radius:999px;border:2px solid #f5d89a;background:transparent;color:#f5d89a;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#again:hover{background:#f5d89a;color:#3d2f22}
</style>
</head>
<body>
<h1>Hamster Survival</h1>
<div class="sub">one hamster. one cage. thirty days.</div>
<div id="cage">🐹</div>
<div id="status">Nibbling quietly.</div>
<div id="stats">
  <div class="stat"><div class="lbl"><span>Food</span><span id="vFood"></span></div><div class="bar"><div class="fill" id="bFood" style="background:var(--accent)"></div></div></div>
  <div class="stat"><div class="lbl"><span>Water</span><span id="vWater"></span></div><div class="bar"><div class="fill" id="bWater" style="background:var(--blue)"></div></div></div>
  <div class="stat"><div class="lbl"><span>Energy</span><span id="vEnergy"></span></div><div class="bar"><div class="fill" id="bEnergy" style="background:var(--good)"></div></div></div>
  <div class="stat"><div class="lbl"><span>Cleanliness</span><span id="vClean"></span></div><div class="bar"><div class="fill" id="bClean" style="background:#c9a0dc"></div></div></div>
</div>
<div id="actions">
  <button data-a="feed">FEED<small>+28 food &middot; &frac12; day</small></button>
  <button data-a="water">FILL BOTTLE<small>+32 water &middot; &frac12; day</small></button>
  <button data-a="clean">CLEAN CAGE<small>+35 clean &middot; 1 day</small></button>
  <button data-a="sleep">LET SLEEP<small>+40 energy &middot; 1 day</small></button>
</div>
<div id="hud">DAY <b id="day">1</b> / 30 &nbsp;&middot;&nbsp; WHEEL LAPS <b id="laps">0</b> &nbsp;&middot;&nbsp; BEST <b id="best">-</b></div>
<div id="log"></div>
<div id="overlay"><h2 id="ovTitle"></h2><p id="ovBody"></p><button id="again">RESTART</button></div>
<script>
const S={food:80,water:80,energy:90,clean:75,day:1,laps:0,alive:true};
const $=id=>document.getElementById(id);
const log=(m,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent='Day '+S.day+' - '+m;$('log').prepend(d);};
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
function render(){
  for(const k of ['food','water','energy','clean']){
    $('b'+k[0].toUpperCase()+k.slice(1)).style.width=S[k]+'%';
    $('v'+k[0].toUpperCase()+k.slice(1)).textContent=S[k]+'%';
  }
  $('day').textContent=S.day;
  $('laps').textContent=S.laps;
  $('best').textContent=localStorage.hamsterBest||'-';
}
function tick(days){
  S.day+=days;
  S.food=clamp(S.food-11*days); S.water=clamp(S.water-15*days);
  S.energy=clamp(S.energy-8*days); S.clean=clamp(S.clean-13*days);
  if(S.energy>35&&Math.random()<.5){const l=200+Math.floor(Math.random()*800);S.laps+=l;log('Night wheel session: '+l+' laps.','good');}
  if(S.clean<25&&Math.random()<.35)log('The cage smells. The hamster judges you.','bad');
  if(S.food<=0||S.water<=0)return die(S.food<=0?'Starved. The food bowl was empty for days.':'Dehydrated. The bottle ran dry.');
  if(S.day>30)return win();
  render();
}
function act(a){
  if(!S.alive)return;
  const cage=$('cage');cage.classList.add('act');setTimeout(()=>cage.classList.remove('act'),200);
  if(a==='feed'){S.food=clamp(S.food+28);S.energy=clamp(S.energy+4);$('status').textContent='Stuffing cheeks.';log('Refilled the food bowl.');tick(.5);}
  if(a==='water'){S.water=clamp(S.water+32);$('status').textContent='Glug glug glug.';log('Fresh water in the bottle.');tick(.5);}
  if(a==='clean'){S.clean=clamp(S.clean+35);S.energy=clamp(S.energy-6);$('status').textContent='Fresh bedding.';log('Cage cleaned. Bedding fluffed.');tick(1);}
  if(a==='sleep'){S.energy=clamp(S.energy+40);$('status').textContent='Curled into a ball. Zzz.';log('A long, deep hamster nap.');tick(1);}
}
function die(why){S.alive=false;show('GONE TO THE BIG WHEEL',why+' Survived to day '+S.day+' with '+S.laps+' wheel laps.');}
function win(){
  S.alive=false;
  const best=Math.max(S.laps,+(localStorage.hamsterBest||0));localStorage.hamsterBest=best;
  show('30 DAYS SURVIVED','A thriving, round, judgmental hamster. '+S.laps+' total wheel laps. It has never known hardship, only snacks.');
}
function show(t,b){$('ovTitle').textContent=t;$('ovBody').textContent=b;$('overlay').classList.add('show');}
document.querySelectorAll('#actions button').forEach(b=>b.onclick=()=>act(b.dataset.a));
$('again').onclick=()=>location.reload();
render();
log('A hamster arrives. It is small and full of opinions.');
</script>
</body>
</html>
